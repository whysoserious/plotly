[package]
name = "plotly"
version = "0.1.0"
edition = "2021"
description = "TUI in Rust to drive an iDraw 2.0 pen plotter (DrawCore firmware)"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ctrlc = { version = "3.4", features = ["termination"] }
kurbo = "0.11"
ratatui = "0.29"
serialport = "4.7"
usvg = "0.44"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono"] }
tracing-appender = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
