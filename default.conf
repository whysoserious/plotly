# plotly — annotated default configuration
# ============================================================================
#
# This file is documentation, not something plotly reads. Copy the lines you
# want into the real config and delete the rest:
#
#     ~/.config/plotly/config.toml        (Linux; $XDG_CONFIG_HOME/plotly/)
#
# Everything here is optional. What you leave out keeps the built-in value for
# the profile, which for most fields the machine itself overrides at startup
# from its `$$` dump — plotly asks the board how big it is and how fast it may
# go, and believes it (DESIGN.org §10). The values shown are the built-ins for
# `idraw-a0`; other profiles differ only in field size.
#
# One thing to know before changing anything: a missing or misspelt key is an
# error, not a shrug. `pen_dwon_z = 5.0` refuses to start rather than quietly
# plotting at the wrong pen height. And whatever you set, the resolved values
# are logged at startup, so a claim about what is in force can be checked:
#
#     grep "machine profile" plotly.log | tail -1
#
# Sections are per profile name. `--profile idraw-a3` reads [profiles.idraw-a3].
# Known names: idraw-a0, idraw-a1, idraw-a2, idraw-a3, idraw-a4, idraw-xlx,
# idraw-b6, idraw-minikit.


# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ SPEED — read this before turning any single knob                         ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Where the time actually goes. example.svg, 6312 shapes, dry-run through the
# time estimate (DESIGN.org §2.8, §2.10):
#
#     shipped as of 2026-09-02 ................... 2:31:43
#     ships now (see "what changed", below) ...... 2:00:40
#     + pen_up_z = 3.0 ........................... 1:54:21
#     + accel_mm_s2 = 6000 ....................... 1:49:59
#     + ramp_mm = 0 .............................. 1:43:09
#
# Those are estimates, and they run about 12% optimistic: the one wall-clock
# figure for the first line is 2:51:54. The known cause is the pen move, which
# the model costs at 54 ms and the machine takes ~240 ms over (§2.6) — so
# anything on this page that shortens a pen move is worth MORE than the table
# credits it with, and `pen_up_z` most of all.
#
# Two things are worth knowing before touching anything:
#
#   * The PEN MOVES ARE ~40% OF THE PLOT. Two per shape, ~240 ms each. Nothing
#     about the drawing is on the paper during any of them.
#   * WHAT IS LEFT IS MOSTLY `draw_feed`, and it is the one knob whose cost is
#     paid in ink rather than in time. See below.
#
# The ladder, each knob measured on its own from the defaults in this file
# (estimate, example.svg, base 2:00:40):
#
#   draw_feed      2000 -> 3000    -24 min   ✱ the whole question is the paper
#   ramp_mm         1.0 -> 0        -7 min   gives up the hook fix entirely
#   pen_up_z        0.5 -> 3.0      -6 min   ✱ and probably worth much more
#   accel_mm_s2    3000 -> 6000     -4 min   ✱ (10000 is -6)
#   junction_deviation_mm            0 min   on this drawing; see below
#   max_segment_mm                   0 min   in either direction
#
# `draw_feed` is the big one, and it is NOT the settled question §2.8 made it
# out to be. That section says the feed does not affect the time at all, on
# the grounds that drawing is acceleration-limited. The estimate disagrees in
# both directions, and it reproduces the one measured figure we have for the
# downward one (F1000 everywhere: +72 min here, +80 min on the clock).
#
# What stops it being a free 24 minutes is §2.5: F1000 draws clean, F1400
# leaves a ~2 mm hook. BUT that bisection was run WITHOUT the ramp, and the
# ramp is precisely what now slows the places a hook forms — every stroke end
# and every corner past `ramp_angle_deg`. Whether 3000 is clean WITH the ramp
# in place has never been put on paper, and the probe for it does not exist
# yet either: `fence --ladder` runs each of its rows at a constant feed and no
# ramp, which is the old question. What is needed is one sheet, one ramped
# serpentine per draw_feed — `--rampladder` already draws the ramped
# serpentine, it just ladders the lead-in rather than the feed.
#
# ✱ Until that sheet exists, 2000 stays the default. It is the reference
# driver's number too, so nothing is lost by waiting.
#
# `junction_deviation_mm` moves nothing on a vpype hatch, and the reason is
# worth knowing rather than surprising: a hatch turns through 180° at the end
# of every pass, and no cornering tolerance carries speed through a reversal.
# On a drawing made of flattened curves it would matter.
#
# `max_segment_mm` moves nothing either way, which is worth saying because it
# looks like it should. The board answers each line in ~6 ms and holds 15 of
# them, which even at 1 mm segments is more look-ahead than the head can eat.
#
# A "go faster" block, to paste and then trim — worth about ten minutes here,
# and another twenty-four if the feed ladder comes out clean:
#
#     [profiles.idraw-a0]
#     pen_up_z = 3.0              # ✱ must still clear the paper
#     accel_mm_s2 = 6000.0        # ✱ the gantry has to survive it
#     # draw_feed = 3000          # ✱ only once the ladder above is clean
#
# There is no need to plot anything to see what a change does. Load the
# drawing with the mock and read the `est` figure in the status bar:
#
#     cargo run -- --simulate drawing.svg
#
# WHAT CHANGED (2026-09-18). Three defaults moved, all towards the reference
# driver's own behaviour, so that an out-of-the-box plotly is no slower than
# "iDraw 2.0 Control" on the same drawing (DESIGN.org §2.10):
#
#     pen_fence          "dwell" -> "off"    21 min on example.svg
#     pen_settle_up_secs  0.05   -> 0.0       5 min
#     travel_feed         8000   -> 12000     5 min, the machine's own $111
#
# Together: 2:31:43 -> 2:00:40, a fifth of the plot.
#
# Nothing else about plotly is slower than the reference except the ramp,
# which the reference does not have and which costs seven minutes.


[profiles.idraw-a0]

# ── The drawable field ──────────────────────────────────────────────────────
# Size of the area the head can reach, in millimetres. Normally left out: the
# firmware reports it in `$130`/`$131` and knows better than any table. Set it
# only to plan for a machine that is not the one plugged in.
#
# Nothing clips a drawing to this yet — soft limits are off on this firmware
# ($20=0), so bounds are the host's job (§2.4). A drawing that sticks out is a
# warning in the log and a note on screen, not a refusal.
width_mm = 841.0
height_mm = 1189.0

# ── Pen height ──────────────────────────────────────────────────────────────
# Z is inverted on this machine: LARGER Z means LOWER. Homing leaves Z at 0,
# which is the top, so pen_up_z is small and pen_down_z is large.
#
# pen_down_z is the one number worth calibrating for each pen, and it belongs
# to the pen rather than to the machine: how far the tip protrudes from the
# holder moves it by whole millimetres. Do not guess it here — press `.` and
# `,` while a line is being drawn, watch the paper, and copy the value out of
# the status bar. Too light and the line breaks up; too heavy and an Isograph
# floods ink where it lands.
#
# pen_up_z is a SPEED setting as much as a clearance one: the gap between the
# two heights is travelled twice per shape, ~240 ms each way. Raising it to
# 3.0 — a 2 mm lift instead of 4.5 mm — is worth six minutes on a 6312-shape
# drawing by the estimate, and probably a good deal more than that, because
# the estimate costs a Z move at 54 ms and the machine takes 240 (§2.6).
# ✱ Verify on the machine that the tip still clears the paper: the saving is
# not worth a line dragged across the sheet between shapes.
pen_up_z = 0.5
pen_down_z = 5.0

# Feed for the pen's own Z move, mm/min. Note that this axis does not obey it:
# 4.5 mm has been measured taking anywhere from 87 to 276 ms against a
# commanded F5000, which would be 54 ms. Unexplained (§2.6); raising this is
# unlikely to buy anything.
pen_z_feed = 5000

# How long to hold still after the pen has moved, seconds. BOTH SHIP AT ZERO,
# for different reasons.
#
# Stillness on the paper costs ink — the tip sitting in one place is how a plot
# ends up with a dot at the start of every stroke (§2.7) — so the landing has
# always shipped at zero.
#
# Stillness in the air only costs time, and the lift used to ship at 0.05 s as
# insurance against the pen swinging. Nothing ever measured that swing, and the
# paired print that retired the fence ran its whole "off" side with no settle
# at all and came out indistinguishable, so the insurance has no claim behind
# it: 50 ms per shape, five minutes on example.svg. The reference driver also
# ships its `pen_delay_up` at zero.
#
# Raise the lift one if a springy holder turns out to need it. Under
# `pen_fence = "off"` the wait is queued on the board rather than waited out by
# the host, so it costs exactly the stillness it asks for and no round trip.
pen_settle_up_secs = 0.0
pen_settle_down_secs = 0.0

# What holds XY still while the pen moves (§2.5, §2.7):
#   "off"    no fence. The Z move joins the planner queue like any other block,
#            so the machine never stops between a stroke and the travel after
#            it and the host never waits for a round trip. This is what the
#            reference driver does, and the default.
#   "dwell"  a G4 before the Z move and another after it. Measured to really
#            wait: 4.336 s against a 4.0 s move. Costs G4's ~50 ms floor four
#            times per shape AND empties the planner twice — about 20 minutes
#            on example.svg.
#   "poll"   ask `?` until the machine says Idle. Same guarantee as the dwell,
#            no 50 ms floor, a few more round trips.
#
# The fence was built on the theory that Grbl's look-ahead carries speed
# through the corner between the last drawn segment and the Z move, hooking the
# stroke end. A paired print of "dwell" against "off" — same pen, same paper,
# same hour — came out indistinguishable, and the hooks turned out to be the
# drawing feed instead, which `ramp_mm` handles. If hooks ever come back this
# is NOT the first knob to reach for; `ramp_feed` is.
pen_fence = "off"

# ── Speeds ──────────────────────────────────────────────────────────────────
# All in mm/min. Every one of them is clamped to max_feed, and a request above
# it is logged rather than silently obeyed.
#
# draw_feed is the speed that decides whether the paper gets marked where the
# pen stops or turns. Measured on this machine, WITHOUT the ramp: F1000 clean,
# F1200 hooks, F1400 leaves a ~2 mm hook.
#
# It is also, by a distance, the most valuable number on this page: ±1000
# either way is ±24 minutes on a 6312-shape drawing. The ramp exists so that
# the cure for a hook is not paying that on the way down; see the speed
# section at the top of this file for why going UP is an open question rather
# than a free lunch. The reference driver ships the same 2000.
draw_feed = 2000

# Pen-up travel between shapes. Has no effect on the marks: tested at 300 and
# at 8000 with everything else held, no difference on paper. So it goes as fast
# as the machine allows — 12000 is the slower of our A0's `$110`/`$111`, and
# `max_feed` holds it to whatever the board in the room actually reports. The
# reference driver settles for 8000.
#
# Only long travels feel it. A 5 mm hop between two hatch lines never reaches
# either speed; a 200 mm jump across the sheet saves a fifth of a second.
travel_feed = 12000

# Interactive jogging with the arrow keys. Well under the machine maximum so a
# held key cannot slam the carriage into the frame.
jog_feed = 3000

# The ceiling for every XY feed above, mm/min. Normally left out: it is read
# from the slower of the firmware's `$110`/`$111`, which is the real limit.
max_feed = 12000

# ── The ramp: fast in the middle, slow where it matters ─────────────────────
# A tube nib dragged at speed sits deflected backwards. When the machine stops
# or turns, the deflection unloads and lays ink back along the direction the
# head came from — about 2 mm of it, sticking out of the stroke wherever the
# approach was not along the same axis. That is the hook (§2.5).
#
# Drawing the whole plot slowly fixes it and costs an hour and twenty minutes
# on a 6312-shape drawing. Slowing only the places where the pen actually stops
# or turns fixes it for seven.
#
# Those seven minutes are the only thing plotly spends that the reference
# driver does not. `ramp_mm = 0` buys them back and gives up the fix with them.
#
# ramp_mm is how much of each such place runs at ramp_feed: both ends of every
# stroke, and this much either side of every corner. Measured with
# `cargo run --example fence -- --rampladder`: 1 mm is the shortest that comes
# out clean. Zero switches the ramp off entirely.
ramp_mm = 1.0

# The slow feed itself. The threshold is between 1000 and 1200, so this has
# little margin. If hooks ever come back — a different pen, different paper, a
# worn nib — reach for THIS first (800, 600), not for a longer ramp: speed is
# what decides whether the mark forms, length only decides how much of the
# stroke is protected from it.
ramp_feed = 1000

# How sharp a corner has to be, in degrees, to earn a ramp of its own.
# Interior corners are the point rather than an extra: a vpype hatch is one
# long stroke whose every turn is interior, so ramping the ends alone leaves
# the whole serpentine at full speed. Too low a threshold and a flattened curve
# — which is thousands of tiny bends — would crawl from end to end.
#
# Raising it is a speed knob with a visible cost: at 40° the gentler turns of a
# curve keep full speed and may hook.
ramp_angle_deg = 20.0

# ── Plan granularity ────────────────────────────────────────────────────────
# Longest single move the plan will emit, mm. Long moves are split so that a
# stop, a pause or a crash lands on a fine boundary and resuming picks up close
# to where it left off (§6). Smaller is finer-grained and more commands on the
# wire; larger is fewer commands and a coarser resume.
#
# Not a speed knob in either direction, and it is worth knowing why, because it
# looks like one. The board answers each line in ~6 ms and holds 15 of them in
# its planner, which at this size is 75 mm of look-ahead — far more than the
# head can consume. The reference driver sends segments of under a millimetre
# and is not slowed by it either.
max_segment_mm = 5.0

# ── Firmware settings ───────────────────────────────────────────────────────
# These two are different from everything above: they are WRITTEN TO THE
# BOARD'S EEPROM at startup, when they are named here and `$$` disagrees. They
# outlive plotly and every other sender, including the vendor software. Leave
# them out and the machine keeps whatever it has.
#
# They exist because getting them right by hand, in a console, and then
# remembering what was set, is the part that kept going wrong — three times
# running the value on the machine was still the Grbl default while everyone
# believed otherwise.
#
# Our A0 reports, factory: $110=15000 $111=12000 $120=$121=3000 $11=0.010.
# The vendor software changes none of them, so anything here is
# plotly going beyond the calibration the machine shipped with — which is also
# why every line in this section is marked ✱: verify it on the machine.

# `$120`/`$121`, mm/s². Drawing is acceleration-limited on short work: on a
# 5 mm hatch segment at F2000 the head spends the whole segment ramping and
# never reaches the feed at all, and doubling this takes about 30% off THAT
# SEGMENT. Across a whole plot it is worth less than the arithmetic suggests —
# four minutes at 6000, six at 10000 — because the pen moves and the travel do
# not care. Useful, not decisive.
#
# Grbl ships 3000, which is 0.3 g thrown at an A0 gantry at the end of every
# stroke, and the board arrived with exactly that. It was suspected of causing
# the hooks for a long time and does not: 500 and 3000 were indistinguishable
# on paper, which also means there is no ink-quality argument against raising
# it. What there is instead is a mechanical one — belts, pulleys and the mass
# of an A0 gantry — so ✱ go up in steps (4000, 6000) and listen to the machine.
accel_mm_s2 = 3000.0

# `$11`, mm: how much speed the planner may carry through a corner — how far
# off the corner it is allowed to cut to do it. Grbl's default is 0.010, which
# is conservative; on a flattened curve, where every few millimetres is a
# shallow turn, it is what decides whether the head flows or stutters.
#
# Also tried against the hooks (0.002 vs 0.010) with no effect, so raising it
# is a speed change and not a quality one — up to the point where a visibly
# cut corner is a quality change. ✱ 0.05 is a reasonable first step.
#
# On a vpype hatch it changes NOTHING, measured: 0.05 and 0.20 both come out
# to the same second as 0.010, with the ramp on and off. A hatch turns through
# 180° at the end of every pass and no cornering tolerance carries speed
# through a reversal. Reach for this on flattened curves, not on fills.
#
# The time estimate reads this and `accel_mm_s2` to model the machine, so they
# are worth having right even when they are the defaults.
junction_deviation_mm = 0.010
